# Pipeline declarativo (Lakeflow SDP, SQL, serverless): bronze → silver → gold.
# A silver é o schema padrão; a gold escreve com o nome completo lakehouse_vertice.gold.x.
resources:
  pipelines:
    vertice_medalhao:
      name: vertice_medalhao
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      photon: true
      libraries:
        - glob:
            include: ../src/silver/**
        - glob:
            include: ../src/gold/**
