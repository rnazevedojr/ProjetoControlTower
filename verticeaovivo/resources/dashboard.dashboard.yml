# Dashboard do portfólio (AI/BI). O JSON é gerado por scripts/gerar_dashboard.py:
# não edite o .lvdash.json à mão, rode o script de novo.
# As queries da gold usam o nome puro da tabela: catálogo e schema vêm daqui.
resources:
  dashboards:
    dashboard_portfolio:
      display_name: "Projeto Farol · Portfólio"
      file_path: ./dashboard-portfolio.lvdash.json
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
      warehouse_id: ${var.warehouse_id}
